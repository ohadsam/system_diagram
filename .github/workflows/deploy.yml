name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is the static site (no build step) — vendor/,
          # css/, js/, index.html, help.html. node_modules/tests are dev-only
          # and irrelevant to what gets served, but Pages ignores dotfiles
          # like .github anyway, and the rest is harmless to include.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
