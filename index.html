<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>System Design Diagram Builder</title>
  <meta name="description" content="Design system architecture diagrams with a huge library of servers, databases, AWS services, frameworks and more — drag, connect, style, and export. Runs entirely in your browser." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4F46E5" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <!-- Applies a stored dark/light theme choice before first paint, so a
       visitor who already chose one doesn't see a flash of the other theme
       while js/main.js's module script loads. Deliberately synchronous
       (not type="module", which defers) and reads localStorage directly
       rather than importing io/uiPrefs.js — see js/io/theme.js's header
       comment, which does the same thing (and is what every later theme
       change actually goes through) for why the two aren't merged into one. -->
  <script>
    (function () {
      try {
        var prefs = JSON.parse(localStorage.getItem('prefs') || '{}');
        if (prefs.theme === 'dark' || prefs.theme === 'light') {
          document.documentElement.setAttribute('data-theme', prefs.theme);
        }
      } catch (e) { /* localStorage unavailable (private mode, etc.) — fall back to prefers-color-scheme */ }
    })();
  </script>

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/toolbar.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/canvas.css" />
  <link rel="stylesheet" href="css/node.css" />
  <link rel="stylesheet" href="css/connector.css" />
  <link rel="stylesheet" href="css/modal.css" />
  <link rel="stylesheet" href="css/panel.css" />
  <link rel="stylesheet" href="css/hints.css" />
  <link rel="stylesheet" href="css/suggestions.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <noscript>This app needs JavaScript enabled to run — it builds diagrams entirely in your browser, no server involved.</noscript>

  <!-- Sketch Mode's hand-drawn wobble (css/canvas.css's body.sketch-mode rules
       reference this by url(#sketch-wobble)) — a shared SVG filter def lives
       here rather than per-element inline, since a filter def is inert on
       its own (no visual output, `width`/`height` 0 keeps it fully out of
       layout) and every sketched element references the same one. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="sketch-wobble">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.035" numOctaves="2" seed="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div id="app">
    <header id="toolbar" aria-label="Toolbar"></header>
    <div class="app-body">
      <nav id="sidebar" aria-label="Component library"></nav>
      <main id="canvas-viewport" aria-label="Diagram canvas" tabindex="0"></main>
      <aside id="details-panel" aria-label="Component details"></aside>
      <aside id="outline-panel" aria-label="Diagram outline"></aside>
      <aside id="animation-panel" aria-label="Diagram animation"></aside>
      <aside id="ai-review-panel" aria-label="AI design review"></aside>
      <aside id="ai-chat-panel" aria-label="AI chat"></aside>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
